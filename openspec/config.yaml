schema: spec-driven

context: |
  Project: YouTube Custom Light, a single-file browser userscript for YouTube.
  Runtime: Tampermonkey or Violentmonkey; plain JavaScript and injected CSS.
  Keep youtube-custom-light.user.js installable directly from the repository root.
  Do not introduce a build step or runtime dependency without a clear need.
  User-facing panel text is Spanish. Preferences are stored locally through the
  userscript manager. YouTube DOM selectors are changeable and should be tested.
  Development checks use Node.js built-ins: npm run check, npm test, and
  npm run test:mutation.

rules:
  proposal:
    - State user-visible goals and non-goals.
    - Keep the installable userscript as the runtime source of truth.
  tasks:
    - Include verification commands for changes to runtime behavior.
  specs:
    - Describe observable behavior rather than implementation details where possible.
